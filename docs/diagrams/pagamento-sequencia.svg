<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b4a40"/></marker>
<marker id="ar-terra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5451b"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5d3a"/></marker>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c567a"/></marker>
<marker id="ar-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a8a7e"/></marker>
</defs>
<rect width="1440" height="960" fill="#ffffff"/>
<text x="40" y="36.0" font-size="24" font-weight="bold" fill="#2a201a" text-anchor="start">
<tspan x="40" dy="0.0">Pagamento demonstrativo — simulação local e integração conceitual</tspan>
</text>
<rect x="50" y="70" width="240" height="72" rx="10" fill="#e2ede3" stroke="#2f5d3a" stroke-width="1.5"/>
<text x="170" y="96.0" font-size="17" font-weight="bold" fill="#23452c" text-anchor="middle">
<tspan x="170" dy="0.0">Cliente</tspan>
</text>
<line x1="170" y1="142" x2="170" y2="820" stroke="#d9c6b2" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="400" y="70" width="240" height="72" rx="10" fill="#e2ede3" stroke="#2f5d3a" stroke-width="1.5"/>
<text x="520" y="85.6" font-size="17" font-weight="bold" fill="#23452c" text-anchor="middle">
<tspan x="520" dy="0.0">Interface</tspan>
<tspan x="520" dy="20.7">(Web/App/Totem)</tspan>
</text>
<line x1="520" y1="142" x2="520" y2="820" stroke="#d9c6b2" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="780" y="70" width="240" height="72" rx="10" fill="#e2ede3" stroke="#2f5d3a" stroke-width="1.5"/>
<text x="900" y="85.6" font-size="17" font-weight="bold" fill="#23452c" text-anchor="middle">
<tspan x="900" dy="0.0">localStorage</tspan>
<tspan x="900" dy="20.7">(local)</tspan>
</text>
<line x1="900" y1="142" x2="900" y2="820" stroke="#d9c6b2" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="1140" y="70" width="240" height="72" rx="10" fill="#e2ede3" stroke="#2f5d3a" stroke-width="1.5"/>
<text x="1260" y="85.6" font-size="17" font-weight="bold" fill="#23452c" text-anchor="middle">
<tspan x="1260" dy="0.0">PaymentSimulator</tspan>
<tspan x="1260" dy="20.7">(local)</tspan>
</text>
<line x1="1260" y1="142" x2="1260" y2="820" stroke="#d9c6b2" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="170" y1="200" x2="520" y2="200" stroke="#5b4a40" stroke-width="1.8" marker-end="url(#ar-ink)"/>
<text x="345.0" y="184.0" font-size="14" font-weight="normal" fill="#5b4a40" text-anchor="middle">
<tspan x="345.0" dy="0.0">Confirma pedido e escolhe Pix ou cartão</tspan>
</text>
<line x1="520" y1="280" x2="900" y2="280" stroke="#5b4a40" stroke-width="1.8" marker-end="url(#ar-ink)"/>
<text x="710.0" y="264.0" font-size="14" font-weight="normal" fill="#5b4a40" text-anchor="middle">
<tspan x="710.0" dy="0.0">Salva pedido AGUARDANDO_PAGAMENTO</tspan>
</text>
<line x1="900" y1="360" x2="520" y2="360" stroke="#2c567a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar-blue)"/>
<text x="710.0" y="344.0" font-size="14" font-weight="normal" fill="#2c567a" text-anchor="middle">
<tspan x="710.0" dy="0.0">Pedido salvo + código</tspan>
</text>
<line x1="520" y1="440" x2="1260" y2="440" stroke="#5b4a40" stroke-width="1.8" marker-end="url(#ar-ink)"/>
<text x="890.0" y="424.0" font-size="14" font-weight="normal" fill="#5b4a40" text-anchor="middle">
<tspan x="890.0" dy="0.0">Inicia simulação local</tspan>
</text>
<line x1="1260" y1="520" x2="520" y2="520" stroke="#2c567a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar-blue)"/>
<text x="890.0" y="504.0" font-size="14" font-weight="normal" fill="#2c567a" text-anchor="middle">
<tspan x="890.0" dy="0.0">Retorna aprovação, recusa ou timeout</tspan>
</text>
<line x1="520" y1="600" x2="900" y2="600" stroke="#5b4a40" stroke-width="1.8" marker-end="url(#ar-ink)"/>
<text x="710.0" y="584.0" font-size="14" font-weight="normal" fill="#5b4a40" text-anchor="middle">
<tspan x="710.0" dy="0.0">Atualiza o estado do pedido</tspan>
</text>
<line x1="900" y1="680" x2="520" y2="680" stroke="#2c567a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar-blue)"/>
<text x="710.0" y="664.0" font-size="14" font-weight="normal" fill="#2c567a" text-anchor="middle">
<tspan x="710.0" dy="0.0">Estado salvo localmente</tspan>
</text>
<line x1="520" y1="740" x2="170" y2="740" stroke="#2c567a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar-blue)"/>
<text x="345.0" y="724.0" font-size="14" font-weight="normal" fill="#2c567a" text-anchor="middle">
<tspan x="345.0" dy="0.0">Exibe resultado + código de retirada</tspan>
</text>
<rect x="40" y="790" width="1360" height="130" rx="12" fill="#fdfaf6" stroke="#d9c6b2" stroke-width="1.5"/>
<text x="60" y="820.0" font-size="16" font-weight="bold" fill="#b5451b" text-anchor="start">
<tspan x="60" dy="0.0">Fluxos alternativos</tspan>
</text>
<text x="60" y="848.0" font-size="14" font-weight="normal" fill="#2a201a" text-anchor="start">
<tspan x="60" dy="0.0">Recusa (ex.: cartão final 0000): resultado RECUSADO → status PAGAMENTO_RECUSADO → oferta de nova tentativa.</tspan>
</text>
<text x="60" y="874.0" font-size="14" font-weight="normal" fill="#2a201a" text-anchor="start">
<tspan x="60" dy="0.0">Timeout: interface mantém AGUARDANDO_PAGAMENTO e permite consultar o pedido.</tspan>
</text>
<text x="60" y="900.0" font-size="14" font-weight="normal" fill="#2a201a" text-anchor="start">
<tspan x="60" dy="0.0">Aprovação: confirma o pedido, credita pontos (R$ 1 = 1 ponto) e libera o acompanhamento e a fila da cozinha.</tspan>
</text>
<text x="60" y="916.0" font-size="12" font-weight="normal" fill="#7d6c61" text-anchor="start">
<tspan x="60" dy="0.0">Integração conceitual futura: interface → backend → sistema externo; aprovação, recusa ou timeout retornariam ao pedido.</tspan>
</text>
</svg>