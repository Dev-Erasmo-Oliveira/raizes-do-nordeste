<text x="64" y="330.0" font-size="19" font-weight="bold" fill="#b5451b" text-anchor="start">
<tspan x="64" dy="0.0">Controles implementados</tspan>
</text>
<circle cx="72" cy="364" r="4" fill="#b5451b"/>
<text x="86" y="364.0" font-size="15" font-weight="normal" fill="#2a201a" text-anchor="start">
<tspan x="86" dy="0.0">Banner com aceitar todos, somente essenciais e preferências.</tspan>
</text>
<circle cx="72" cy="402" r="4" fill="#b5451b"/>
<text x="86" y="402.0" font-size="15" font-weight="normal" fill="#2a201a" text-anchor="start">
<tspan x="86" dy="0.0">Aviso de privacidade no checkout, sem checkbox obrigatório.</tspan>
</text>
<circle cx="72" cy="440" r="4" fill="#b5451b"/>
<text x="86" y="440.0" font-size="15" font-weight="normal" fill="#2a201a" text-anchor="start">
<tspan x="86" dy="0.0">Preferências opcionais salvas localmente, sem envio de eventos ou ofertas.</tspan>
</text>
<circle cx="72" cy="478" r="4" fill="#b5451b"/>
<text x="86" y="478.0" font-size="15" font-weight="normal" fill="#2a201a" text-anchor="start">
<tspan x="86" dy="0.0">Marketing e analytics desligados por padrão nas preferências.</tspan>
</text>
<circle cx="72" cy="516" r="4" fill="#b5451b"/>
<text x="86" y="516.0" font-size="15" font-weight="normal" fill="#2a201a" text-anchor="start">
<tspan x="86" dy="0.0">Exportação dos dados em JSON e exclusão com confirmação.</tspan>
</text>
<circle cx="72" cy="554" r="4" fill="#b5451b"/>
<text x="86" y="554.0" font-size="15" font-weight="normal" fill="#2a201a" text-anchor="start">
<tspan x="86" dy="0.0">Pedidos ficam no navegador; sem API ou gateway real configurado.</tspan>
</text>
<rect x="740" y="296" width="660" height="300" rx="14" fill="#fdfaf6" stroke="#d9c6b2" stroke-width="1.5"/>
<text x="764" y="330.0" font-size="19" font-weight="bold" fill="#2f5d3a" text-anchor="start">
