</text>
<text x="764" y="432.0" font-size="14" font-weight="normal" fill="#5b4a40" text-anchor="start">
<tspan x="764" dy="0.0">produção e conferência no balcão</tspan>
</text>
<text x="764" y="456.0" font-size="15" font-weight="bold" fill="#2a201a" text-anchor="start">
