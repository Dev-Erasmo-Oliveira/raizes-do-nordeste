</text>
<text x="764" y="500.0" font-size="15" font-weight="bold" fill="#2a201a" text-anchor="start">
<tspan x="764" dy="0.0">Consentimento</tspan>
</text>
<text x="764" y="520.0" font-size="14" font-weight="normal" fill="#5b4a40" text-anchor="start">
